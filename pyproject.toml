[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphword"
version = "0.1.0"
description = "Partitionable word graph engine for the GraphWord cloud project"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[tool.setuptools.packages.find]
include = ["graphword*"]
