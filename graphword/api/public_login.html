<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso a GraphWord</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #18283b; margin: 0; }
    main { max-width: 360px; margin: 12vh auto; padding: 28px; background: white; border-radius: 12px; }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 18px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
    button { width: 100%; padding: 12px; margin-top: 22px; background: #1461a9; color: white; border: 0; border-radius: 6px; }
    .message { color: #a21a24; }
    small { display: block; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>GraphWord</h1>
    <p>Introduce las credenciales de la demostración para abrir la API.</p>
    <p class="message">{{message}}</p>
    <form action="/login" method="post">
      <label for="username">Usuario</label>
      <input id="username" name="username" value="graphword" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar a Swagger</button>
    </form>
    <small>Sesión de dos horas. No se guarda la contraseña en la página.</small>
  </main>
</body>
</html>
