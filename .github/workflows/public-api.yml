name: GraphWord Public HTTPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Publicar/reanudar la URL o pausarla para ahorrar crédito'
        type: choice
        options: [deploy, pause]
        default: deploy

permissions:
  contents: read

concurrency:
  group: graphword-ci-cd
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,aws,aws-test,public]'
      - run: python -m unittest discover -s tests -v

  public-api:
    needs: test
    if: >-
      github.repository == 'guillecubas/GraphWord' &&
      github.ref == 'refs/heads/refactor/python-distributed' &&
      vars.AWS_ACCOUNT_ID != ''
    runs-on: [self-hosted, linux, x64, graphword-lab]
    timeout-minutes: 20
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 scripts/despliegue/verify_lab_ec2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[aws]'
      - name: Deploy and verify protected URL
        if: inputs.action == 'deploy'
        env:
          GRAPHWORD_DEMO_PASSWORD: ${{ secrets.GRAPHWORD_DEMO_PASSWORD }}
        run: .venv/bin/python -m scripts.despliegue.public_api deploy
      - name: Pause public URL
        if: inputs.action == 'pause'
        run: .venv/bin/python -m scripts.despliegue.public_api pause
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aws-public-api
          path: var/aws-public-api.json
          if-no-files-found: warn
