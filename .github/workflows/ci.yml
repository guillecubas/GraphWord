name: GraphWord Python CI

on:
  push:
    branches: [main, public-clean, 'refactor/**']
  pull_request:
    branches: [main, public-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests and preserve exit status
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.python-version }}
          path: test-results/
