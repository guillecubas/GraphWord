name: GraphWord CI/CD

on:
  push:
    branches: [main, public-clean, 'refactor/**']
  pull_request:
    branches: [main, public-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,aws,aws-test]"
      - name: Run tests and preserve exit status
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.python-version }}
          path: test-results/

  deploy:
    needs: test
    if: >-
      github.repository == 'guillecubas/GraphWord' &&
      github.ref == 'refs/heads/refactor/python-distributed' &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_AWS_DEPLOY == 'true' &&
      vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: graphword-aws-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Academy entrega tres valores temporales; no aceptar una sesión incompleta.
      - name: Check temporary lab secrets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_SESSION_TOKEN" ]; then
            echo "::error::Configura los tres Secrets temporales de AWS Academy antes de desplegar."
            exit 1
          fi
      - run: python -m pip install -e ".[aws]"
      # Usar la sesión del laboratorio; no crear roles IAM ni solicitar OIDC.
      - name: Authenticate with temporary lab credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: us-east-1
          force-skip-oidc: true
          unset-current-credentials: true
          translate-env-variables: false
          mask-aws-account-id: true
      - name: Deploy, verify and stop lab nodes
        run: python scripts/despliegue/ci_deploy.py
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-deployment-${{ github.sha }}
          path: var/aws-*.json
