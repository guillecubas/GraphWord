name: GraphWord Python CI

on:
  push:
    branches: [main, public-clean, 'refactor/**']
  pull_request:
    branches: [main, public-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,aws,aws-test]"
      - name: Run tests and preserve exit status
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.python-version }}
          path: test-results/

  deploy:
    needs: test
    if: >-
      github.repository == 'guillecubas/GraphWord' &&
      github.ref == 'refs/heads/refactor/python-distributed' &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_AWS_DEPLOY == 'true' && vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: graphword-aws-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[aws]"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: Deploy, verify and stop lab nodes
        run: python scripts/despliegue/ci_deploy.py
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-deployment-${{ github.sha }}
          path: var/aws-*.json
