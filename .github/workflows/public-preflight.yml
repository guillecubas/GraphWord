name: GraphWord Public Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inspect:
    # Solo leer desde el repositorio privado y la rama autorizada.
    if: >-
      github.repository == 'guillecubas/GraphWord' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/refactor/python-distributed'
    runs-on: [self-hosted, linux, x64, graphword-lab]
    timeout-minutes: 3
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read Lambda limits and existing role
        run: python3 -m scripts.despliegue.inspect_public_access
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-preflight
          path: var/aws-public-preflight.json
